<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — central.acme.fr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login">
    <h1>UnifiedGuard</h1>
    <p class="sub">central.acme.fr</p>
    <form>
      <label for="m">Adresse e-mail</label>
      <input type="email" id="m" placeholder="admin@acme.fr" value="admin@acme.fr">
      <label for="p">Mot de passe</label>
      <input type="password" id="p" placeholder="••••••••••">
      <button class="btn wide" formaction="hub-hosts.html" formmethod="get">Se connecter</button>
    </form>
    <div class="note">🔐 Après le mot de passe, un <b>code MFA</b> t'est envoyé par e-mail — il est <b>obligatoire</b> pour ouvrir la session.</div>
    <p style="text-align:center; margin-top:14px;"><a href="index.html">← retour aux maquettes</a></p>
  </div>
</div>
</body>
</html>
