<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — UnifiedGuard</title>
<link rel="stylesheet" href="static/app.css">
<script src="static/theme-boot.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login">
    <h1>Unified<span class="brand-acc">Guard</span></h1>
    <p class="sub" id="site">central…</p>
    <div id="err" class="err" hidden></div>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn wide" type="submit">Se connecter</button>
    </form>
    <form id="mfa-form" hidden>
      <label for="code">Code MFA (envoyé par e-mail)</label>
      <input type="text" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
      <button class="btn wide" type="submit">Valider le code</button>
    </form>
    <p class="sub preview-note" id="preview-note" hidden>
      Preview sandbox : les requêtes POST y sont bloquées par le proxy —
      <a id="dev-login-link" href="dev-login">connexion directe en un clic (GET)</a>.
    </p>
  </div>
  <div class="theme-pick" role="group" aria-label="Thème">
    <button type="button" data-set-theme="light" title="Thème clair">☀</button>
    <button type="button" data-set-theme="auto"  class="on" title="Auto (système)">◐</button>
    <button type="button" data-set-theme="dark"  title="Thème sombre">☾</button>
  </div>
</div>
<script src="static/theme.js"></script>
<script src="static/login.js"></script>
</body>
</html>
